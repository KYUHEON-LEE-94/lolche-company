name: 전체 랭크 동기화

# Vercel Hobby 는 크론이 하루 1회 + 함수 시간 제한이 있어, sync-all 한 번 호출로는
# 배치(기본 10명) 1개만 처리된다. GitHub Actions 가 매시간 커서를 따라 반복 호출해
# 승인 멤버 전원(stale=1시간 이상)을 갱신한다. public repo 라 Actions 분은 무료.
on:
  schedule:
    - cron: '0 * * * *' # 매시 정각 (UTC). 서버는 stale(1시간+)만 갱신하므로 매시간이면 전원 시간당 1회.
  workflow_dispatch: {} # 수동 실행용

concurrency:
  group: sync-ranks
  cancel-in-progress: false # 이전 실행이 밀려도 겹치지 않게(중복 Riot 호출 방지)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 커서 반복으로 전원 동기화
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          cursor=""
          # 멤버 1명당 최대 ~19초(매치 백필 포함) 걸리므로 배치를 2로 둬 각 호출을
          # Hobby 함수 시간 제한(60초) 안에 끝낸다. 멤버가 늘어도 넉넉하게 최대 30회(2×30=60명) 반복.
          for i in $(seq 1 30); do
            url="${SITE_URL%/}/api/admin/sync-all?limit=2"
            if [ -n "$cursor" ]; then url="${url}&cursorId=${cursor}"; fi
            resp=$(curl -sS --max-time 120 -X GET "$url" -H "Authorization: Bearer ${CRON_SECRET}" || echo '{}')
            echo "batch ${i}: $(printf '%s' "$resp" | head -c 300)"
            # ⚠ jq 의 `//` 는 좌변이 null "또는 false" 면 우변을 쓴다.
            #   `.batch.done // empty` 로 하면 done:false(배치 더 남음, 정상)가 빈 문자열이 되어
            #   파싱 실패로 오판한다. done 은 // 없이 그대로 읽고 true/false 만 유효로 본다.
            done=$(printf '%s' "$resp" | jq -r '.batch.done')
            next=$(printf '%s' "$resp" | jq -r '.batch.nextCursorId // empty')
            if [ "$done" != "true" ] && [ "$done" != "false" ]; then
              echo "::error::sync-all 응답을 파싱할 수 없습니다(인증/배포 확인). 응답: $(printf '%s' "$resp" | head -c 200)"
              exit 1
            fi
            if [ "$done" = "true" ]; then
              echo "전원 동기화 완료 (batch ${i})"
              break
            fi
            cursor="${next}"
            sleep 3
          done
