name: 내전 시작 임박 알림

# Vercel Hobby 는 크론 빈도가 제한되므로, 외부(GitHub Actions)에서 10분마다
# 알림 엔드포인트를 호출한다. 중복 방지는 서버의 reminder_sent_at 이 담당한다.
on:
  schedule:
    # 정각(:00)은 GitHub 부하로 드롭되기 쉬워, off-peak 분으로 ~10분 간격을 잡는다.
    # 몇 분 지연·일부 드롭돼도 임박 알림(30분 창)엔 무방하다.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {} # 수동 실행용

# 이전 실행이 밀려도 겹치지 않게 한다.
concurrency:
  group: notify-reminders
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 알림 엔드포인트 호출
        run: |
          curl -fsS --max-time 60 -X GET \
            "${SITE_URL%/}/api/cron/notify-reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
