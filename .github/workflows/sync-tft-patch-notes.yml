name: 패치 노트(롤체·롤) & 스팀 할인 동기화

on:
  schedule:
    # GitHub Actions 정각 혼잡을 피한 매일 03:17 KST.
    - cron: '17 18 * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-tft-patch-notes
  cancel-in-progress: false

# ⚠ 패치 노트와 스팀 할인은 독립 job 으로 분리한다.
#   한 스텝(패치 노트)이 실패하면 curl -fsS 가 job 을 중단시켜 다음 스텝(스팀 할인)이
#   아예 실행되지 않던 문제가 있었다(스팀 할인 갱신 중단의 원인). job 을 나누면 서로 영향 없다.
jobs:
  patch-notes:
    runs-on: ubuntu-latest
    steps:
      - name: 공식 패치 노트 동기화 호출
        run: |
          curl -fsS --max-time 60 -X GET \
            "${SITE_URL%/}/api/cron/sync-tft-patch-notes" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  steam-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Steam 할인 스냅샷 동기화 호출
        run: |
          curl -fsS --max-time 60 -X GET \
            "${SITE_URL%/}/api/cron/sync-steam-featured-deals" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  lol-patch-notes:
    runs-on: ubuntu-latest
    steps:
      - name: 롤 공식 패치 노트 동기화 호출
        run: |
          curl -fsS --max-time 60 -X GET \
            "${SITE_URL%/}/api/cron/sync-lol-patch-notes" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
